<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PhishGuard</title>
  <style>
    /* ── Reset ─────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { width: 360px; }

    body {
      width: 360px;
      min-height: 480px;
      background: #0d0f14;
      color: #f0f2f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
      font-size: 13px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* ── Animations ─────────────────────────────────────────── */
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(1.15); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Layout ─────────────────────────────────────────────── */
    .root { display: flex; flex-direction: column; min-height: 480px; }

    /* ── Header ─────────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .logo { display: flex; align-items: center; gap: 8px; }
    .logo-icon {
      width: 28px; height: 28px;
      background: linear-gradient(135deg, #6366f1 0%, #818cf8 100%);
      border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
    }
    .logo-text {
      font-size: 14px; font-weight: 600;
      letter-spacing: -0.02em; color: #f0f2f5;
    }
    .logo-text span { color: #6366f1; }
    .header-btns { display: flex; gap: 4px; }
    .icon-btn {
      width: 28px; height: 28px;
      background: transparent; border: none;
      color: #4d5566; cursor: pointer;
      border-radius: 6px; font-size: 15px;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s, color 0.15s;
    }
    .icon-btn:hover { background: #1d2130; color: #8892a4; }

    /* ── URL Bar ─────────────────────────────────────────────── */
    .url-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 12px 16px 8px;
      background: #161923;
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 8px;
      padding: 7px 10px;
    }
    .url-proto {
      font-size: 10px; font-weight: 600;
      padding: 2px 6px; border-radius: 4px;
      background: rgba(34,197,94,0.12);
      color: #4ade80;
      flex-shrink: 0;
      font-family: monospace;
    }
    .url-text {
      flex: 1;
      font-size: 12px;
      color: #8892a4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-family: monospace;
    }
    .scan-btn {
      flex-shrink: 0;
      padding: 4px 12px;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .scan-btn:hover { opacity: 0.85; }
    .scan-btn:disabled { opacity: 0.4; cursor: default; }

    /* ── Content area ────────────────────────────────────────── */
    #content { flex: 1; padding-bottom: 4px; animation: fadeIn 0.2s ease-out; }

    /* ── Footer ─────────────────────────────────────────────── */
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      margin-top: auto;
      border-top: 1px solid rgba(255,255,255,0.06);
    }
    .privacy-badge {
      display: flex; align-items: center; gap: 4px;
      font-size: 10px; color: #4ade80;
      background: rgba(34,197,94,0.08);
      border: 1px solid rgba(34,197,94,0.14);
      border-radius: 4px;
      padding: 3px 7px;
    }
    .footer-dev {
      font-size: 10px; color: #4d5566;
      text-decoration: none;
      transition: color 0.15s;
    }
    .footer-dev:hover { color: #6366f1; }

    /* ── Scrollbar ───────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }
  </style>
</head>
<body>
<div class="root">

  <!-- Header -->
  <header class="header">
    <div class="logo">
      <div class="logo-icon">🛡</div>
      <span class="logo-text">Phish<span>Guard</span></span>
    </div>
    <div class="header-btns">
      <button class="icon-btn" id="refreshBtn" title="Rescan">↻</button>
      <button class="icon-btn" id="settingsBtn" title="Settings">⚙</button>
    </div>
  </header>

  <!-- URL Bar -->
  <div class="url-bar">
    <span class="url-proto" id="urlProto">HTTPS</span>
    <span class="url-text" id="urlText">Detecting page...</span>
    <button class="scan-btn" id="scanBtn">Scan</button>
  </div>

  <!-- Dynamic content (idle / scanning / result / error) -->
  <div id="content"></div>

  <!-- Footer -->
  <footer class="footer">
    <div class="privacy-badge">🔒 Local · No tracking</div>
    <a href="https://akshay.fruvvi.com" target="_blank" class="footer-dev">
      by Akshay
    </a>
  </footer>

</div>
<script src="popup.js"></script>
</body>
</html>
